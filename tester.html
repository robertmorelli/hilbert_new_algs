        // Function to create and connect points in SVG
        function createSvg(points) {
            const svgNS = "http://www.w3.org/2000/svg";
            let svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "200");
            svg.setAttribute("height", "200");

            let polygon = document.createElementNS(svgNS, "polygon");
            polygon.setAttribute("fill", "none");
            polygon.setAttribute("stroke", "black");

            let pointsAttr = points.map(p => `${p.x * (200 / (size * size))},${p.y * (200 / (size * size))}`).join(" ");
            polygon.setAttribute("points", pointsAttr);

            svg.appendChild(polygon);
            document.body.appendChild(svg);
        }

        // Generate points and apply Hilbert functions
        hilbertFunctions.forEach(hilbertFunction => {
            // Create sparse grid points
            const gridPoints = [];
            for (let x = 0; x < size; x += size / 64) {
                for (let y = 0; y < size; y += size / 64) {
                    gridPoints.push({ x: x * size, y: y * size, order: hilbertFunction(x * size, y * size) });
                }
            }
            gridPoints.sort((a, b) => a.order - b.order);
            createSvg(gridPoints);

            // Create random points
            const randomPoints = Array.from({ length: 200 }, () => ({
                x: Math.random() * size,
                y: Math.random() * size,
                order: 0
            })).map(p => ({ ...p, order: hilbertFunction(p.x, p.y) }));
            randomPoints.sort((a, b) => a.order - b.order);
            createSvg(randomPoints);
